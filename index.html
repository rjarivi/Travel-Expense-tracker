<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Luxury Vacation Expense Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
  --bg:#07111f;
  --glass:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.12);
  --text:#ffffff;
  --muted:#9ca3af;
  --primary:#7c3aed;
  --blue:#2563eb;
  --green:#10b981;
  --orange:#f97316;
  --red:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at top left,#312e81,transparent 25%),
    radial-gradient(circle at bottom right,#0f766e,transparent 25%),
    var(--bg);

  color:var(--text);
  min-height:100vh;
  padding:30px;
}

.container{
  max-width:1500px;
  margin:auto;
}

.glass{
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:24px;
  box-shadow:
    0 10px 40px rgba(0,0,0,0.25);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

h1{
  font-size:34px;
}

.subtitle{
  color:var(--muted);
  margin-top:8px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-bottom:25px;
}

.stat{
  padding:25px;
}

.stat h3{
  color:var(--muted);
  margin-bottom:10px;
  font-size:14px;
}

.stat p{
  font-size:32px;
  font-weight:700;
}

.layout{
  display:grid;
  grid-template-columns:400px 1fr;
  gap:25px;
}

.card{
  padding:25px;
}

.card-title{
  margin-bottom:20px;
  font-size:20px;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:14px;
}

input,
select{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:rgba(255,255,255,0.06);
  color:white;
  border:1px solid rgba(255,255,255,0.08);
  outline:none;
}

input::placeholder{
  color:#9ca3af;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.btn{
  width:100%;
  border:none;
  border-radius:16px;
  padding:15px;
  cursor:pointer;
  font-weight:700;
  color:white;
  transition:0.3s;
}

.btn-primary{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.btn-primary:hover{
  transform:translateY(-2px);
}

.expense-list{
  max-height:700px;
  overflow:auto;
}

.expense-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  margin-bottom:14px;
  border-radius:18px;
  background:rgba(255,255,255,0.05);
}

.left{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.category{
  display:inline-block;
  width:fit-content;
  padding:5px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.Accommodation{background:#7c3aed;}
.Transportation{background:#2563eb;}
.Food{background:#10b981;}
.Drinks{background:#f97316;}
.Snacks{background:#ec4899;}
.Shopping{background:#06b6d4;}
.Activities{background:#ef4444;}
.Other{background:#6b7280;}

.amount{
  font-size:22px;
  font-weight:700;
}

.meta{
  color:var(--muted);
  font-size:13px;
}

.delete-btn{
  border:none;
  background:rgba(239,68,68,0.15);
  color:#f87171;
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
}

.chart-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:20px;
}

.chart-card{
  padding:20px;
  min-height:350px;
}

.settlement{
  margin-top:20px;
}

.person{
  padding:18px;
  background:rgba(255,255,255,0.05);
  border-radius:18px;
  margin-bottom:12px;
}

.nights{
  color:#10b981;
  font-weight:600;
}

@media(max-width:1100px){

  .layout{
    grid-template-columns:1fr;
  }

  .chart-grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<div class="container">

<div class="header">
  <div>
    <h1>✈️ Luxury Vacation Expense Tracker</h1>
    <div class="subtitle">
      45-Day Trip • Multi Currency • Hotel Tracking • Smart Split
    </div>
  </div>
</div>

<div class="dashboard">

  <div class="glass stat">
    <h3>Total Expenses</h3>
    <p id="total">$0</p>
  </div>

  <div class="glass stat">
    <h3>Daily Burn Rate</h3>
    <p id="daily">$0</p>
  </div>

  <div class="glass stat">
    <h3>Accommodation</h3>
    <p id="stay">$0</p>
  </div>

  <div class="glass stat">
    <h3>Food & Drinks</h3>
    <p id="food">$0</p>
  </div>

</div>

<div class="layout">

<div class="glass card">

<h2 class="card-title">
  Add Expense
</h2>

<div class="form-group">
  <label>Date</label>
  <input type="date" id="date"/>
</div>

<div class="form-group">
  <label>Category</label>

  <select id="category">
    <option>Accommodation</option>
    <option>Transportation</option>
    <option>Food</option>
    <option>Drinks</option>
    <option>Snacks</option>
    <option>Shopping</option>
    <option>Activities</option>
    <option>Other</option>
  </select>
</div>

<div class="form-group">
  <label>Description</label>
  <input type="text" id="description" placeholder="Hotel, taxi, ramen..." />
</div>

<div class="row">

<div class="form-group">
  <label>Amount</label>
  <input type="number" id="amount" placeholder="0"/>
</div>

<div class="form-group">
  <label>Currency</label>

  <select id="currency">
    <option value="$">USD ($)</option>
    <option value="฿">THB (฿)</option>
    <option value="€">EUR (€)</option>
    <option value="£">GBP (£)</option>
    <option value="¥">JPY (¥)</option>
    <option value="₹">INR (₹)</option>
  </select>
</div>

</div>

<div class="row">

<div class="form-group">
  <label>Paid By</label>

  <select id="paidBy">
    <option>Person 1</option>
    <option>Person 2</option>
    <option>Person 3</option>
  </select>
</div>

<div class="form-group">
  <label>Split</label>

  <select id="splitType">
    <option value="3">3 Way</option>
    <option value="2">2 Way</option>
    <option value="1">Personal</option>
  </select>
</div>

</div>

<h2 class="card-title" style="margin-top:30px;">
  🏨 Hotel Stay
</h2>

<div class="row">

<div class="form-group">
  <label>Check-In</label>
  <input type="date" id="checkin"/>
</div>

<div class="form-group">
  <label>Check-Out</label>
  <input type="date" id="checkout"/>
</div>

</div>

<button class="btn btn-primary" onclick="addExpense()">
  Add Expense
</button>

</div>

<div>

<div class="glass card expense-list">

<h2 class="card-title">
  Expenses
</h2>

<div id="expenses"></div>

</div>

<div class="chart-grid">

<div class="glass chart-card">
  <canvas id="categoryChart"></canvas>
</div>

<div class="glass chart-card">
  <canvas id="payerChart"></canvas>
</div>

</div>

<div class="glass card settlement">

<h2 class="card-title">
  💸 Settlement
</h2>

<div id="settlement"></div>

</div>

</div>

</div>

</div>

<script>

let expenses =
JSON.parse(localStorage.getItem('luxuryExpenses')) || [];

let categoryChart;
let payerChart;

function save(){

  localStorage.setItem(
    'luxuryExpenses',
    JSON.stringify(expenses)
  );
}

function nightsBetween(checkin,checkout){

  if(!checkin || !checkout) return 0;

  const oneDay =
    1000 * 60 * 60 * 24;

  return Math.round(
    (new Date(checkout)-new Date(checkin))
    / oneDay
  );
}

function addExpense(){

  const date =
    document.getElementById('date').value;

  const category =
    document.getElementById('category').value;

  const description =
    document.getElementById('description').value;

  const amount =
    parseFloat(document.getElementById('amount').value);

  const currency =
    document.getElementById('currency').value;

  const paidBy =
    document.getElementById('paidBy').value;

  const splitType =
    parseInt(document.getElementById('splitType').value);

  const checkin =
    document.getElementById('checkin').value;

  const checkout =
    document.getElementById('checkout').value;

  if(!date || !description || !amount){

    alert('Fill all fields');
    return;
  }

  expenses.push({

    id:Date.now(),

    date,
    category,
    description,
    amount,
    currency,
    paidBy,
    splitType,
    checkin,
    checkout
  });

  save();

  render();
}

function removeExpense(id){

  expenses =
    expenses.filter(e=>e.id!==id);

  save();

  render();
}

function renderExpenses(){

  const container =
    document.getElementById('expenses');

  container.innerHTML='';

  expenses
    .slice()
    .reverse()
    .forEach(exp=>{

    const nights =
      nightsBetween(exp.checkin,exp.checkout);

    container.innerHTML += `

      <div class="expense-item">

        <div class="left">

          <span class="category ${exp.category}">
            ${exp.category}
          </span>

          <strong>
            ${exp.description}
          </strong>

          <div class="meta">
            ${exp.date}
            • ${exp.paidBy}
            • ${exp.splitType} way split
          </div>

          ${
            exp.checkin
            ?
            `
            <div class="meta nights">
              🏨 ${exp.checkin}
              → ${exp.checkout}
              (${nights} nights)
            </div>
            `
            :
            ''
          }

        </div>

        <div style="
          display:flex;
          align-items:center;
          gap:10px;
        ">

          <div class="amount">
            ${exp.currency}${exp.amount.toFixed(2)}
          </div>

          <button
            class="delete-btn"
            onclick="removeExpense(${exp.id})"
          >
            ✕
          </button>

        </div>

      </div>
    `;
  });
}

function updateStats(){

  let total = 0;
  let stay = 0;
  let food = 0;

  expenses.forEach(e=>{

    total += e.amount;

    if(e.category === 'Accommodation'){
      stay += e.amount;
    }

    if(
      ['Food','Drinks','Snacks']
      .includes(e.category)
    ){
      food += e.amount;
    }
  });

  const currency =
    expenses[0]?.currency || '$';

  document.getElementById('total')
    .innerText =
      `${currency}${total.toFixed(0)}`;

  document.getElementById('daily')
    .innerText =
      `${currency}${(total/45).toFixed(0)}`;

  document.getElementById('stay')
    .innerText =
      `${currency}${stay.toFixed(0)}`;

  document.getElementById('food')
    .innerText =
      `${currency}${food.toFixed(0)}`;
}

function renderCharts(){

  const categoryData={};
  const payerData={};

  expenses.forEach(e=>{

    categoryData[e.category] =
      (categoryData[e.category] || 0)
      + e.amount;

    payerData[e.paidBy] =
      (payerData[e.paidBy] || 0)
      + e.amount;
  });

  if(categoryChart) categoryChart.destroy();
  if(payerChart) payerChart.destroy();

  categoryChart =
    new Chart(
      document.getElementById('categoryChart'),
      {

      type:'doughnut',

      data:{
        labels:Object.keys(categoryData),

        datasets:[{

          data:Object.values(categoryData),

          borderWidth:0,

          backgroundColor:[
            '#7c3aed',
            '#2563eb',
            '#10b981',
            '#f97316',
            '#ec4899',
            '#06b6d4',
            '#ef4444',
            '#6b7280'
          ]
        }]
      },

      options:{
        plugins:{
          legend:{
            labels:{
              color:'white'
            }
          }
        }
      }

    });

  payerChart =
    new Chart(
      document.getElementById('payerChart'),
      {

      type:'bar',

      data:{
        labels:Object.keys(payerData),

        datasets:[{
          data:Object.values(payerData),
          borderRadius:12,
          backgroundColor:'#7c3aed'
        }]
      },

      options:{

        plugins:{
          legend:{display:false}
        },

        scales:{

          x:{
            ticks:{color:'white'}
          },

          y:{
            ticks:{color:'white'}
          }
        }
      }

    });
}

function settlement(){

  const paid={
    'Person 1':0,
    'Person 2':0,
    'Person 3':0
  };

  const owes={
    'Person 1':0,
    'Person 2':0,
    'Person 3':0
  };

  expenses.forEach(e=>{

    paid[e.paidBy]+=e.amount;

    const share =
      e.amount / e.splitType;

    if(e.splitType===3){

      owes['Person 1']+=share;
      owes['Person 2']+=share;
      owes['Person 3']+=share;
    }

    if(e.splitType===2){

      owes['Person 1']+=share;
      owes['Person 2']+=share;
    }

    if(e.splitType===1){

      owes[e.paidBy]+=e.amount;
    }
  });

  const currency =
    expenses[0]?.currency || '$';

  const div =
    document.getElementById('settlement');

  div.innerHTML='';

  Object.keys(paid).forEach(person=>{

    const balance =
      paid[person] - owes[person];

    div.innerHTML += `

      <div class="person">

        <strong>${person}</strong>

        <br><br>

        Paid:
        ${currency}${paid[person].toFixed(2)}

        <br>

        Share:
        ${currency}${owes[person].toFixed(2)}

        <br>

        Balance:
        <strong style="
          color:${balance >= 0 ? '#10b981' : '#ef4444'}
        ">

          ${currency}${balance.toFixed(2)}

        </strong>

      </div>
    `;
  });
}

function render(){

  renderExpenses();

  updateStats();

  renderCharts();

  settlement();
}

render();

</script>

</body>
</html>
